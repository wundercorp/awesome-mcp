name: Validate catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-catalog.mjs
      - run: node scripts/validate-taxonomy.mjs
      - run: node --test tests/catalog-pages.test.mjs
      # PRs may contain only server.json, or a legacy README edit. Build and
      # validate the generated output, but do not demand fork authors commit it.
      - run: node scripts/generate-readme.mjs
